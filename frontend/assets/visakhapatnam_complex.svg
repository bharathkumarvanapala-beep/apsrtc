<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="coastalSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="glassFacade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#coastalSky)"/>

  <!-- Coastal Ocean & Horizon (Bay of Bengal) -->
  <rect x="0" y="220" width="800" height="60" fill="#0284c7" opacity="0.6"/>
  <!-- Mountain Silhouette (Kailasagiri / Dolphin's Nose) -->
  <path d="M0 240 Q160 190 320 220 T650 200 L800 230 L800 280 L0 280 Z" fill="#0369a1" opacity="0.4"/>

  <!-- Modern RTC Complex Building -->
  <g transform="translate(60, 160)">
    <!-- Main Glass Terminal Block -->
    <rect x="60" y="20" width="560" height="180" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Glass Curtain Windows -->
    <rect x="80" y="40" width="520" height="120" rx="4" fill="url(#glassFacade)" opacity="0.85"/>
    
    <!-- Window Grid Lines -->
    <line x1="160" y1="40" x2="160" y2="160" stroke="#bae6fd" stroke-width="2" opacity="0.5"/>
    <line x1="240" y1="40" x2="240" y2="160" stroke="#bae6fd" stroke-width="2" opacity="0.5"/>
    <line x1="320" y1="40" x2="320" y2="160" stroke="#bae6fd" stroke-width="2" opacity="0.5"/>
    <line x1="400" y1="40" x2="400" y2="160" stroke="#bae6fd" stroke-width="2" opacity="0.5"/>
    <line x1="480" y1="40" x2="480" y2="160" stroke="#bae6fd" stroke-width="2" opacity="0.5"/>

    <!-- Clock Tower Feature -->
    <rect x="290" y="-30" width="100" height="60" rx="4" fill="#072516" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="340" cy="0" r="14" fill="#ffffff"/>
    <line x1="340" y1="0" x2="340" y2="-8" stroke="#000" stroke-width="2"/>
    <line x1="340" y1="0" x2="346" y2="0" stroke="#000" stroke-width="2"/>

    <!-- Header Sign -->
    <rect x="140" y="24" width="400" height="24" rx="4" fill="#072516"/>
    <text x="340" y="40" font-size="11" fill="#fef08a" font-family="sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1">DWARAKA RTC COMPLEX • VISAKHAPATNAM</text>
  </g>

  <!-- Palm Trees (Coastal Vibe) -->
  <g transform="translate(40, 260)">
    <path d="M20 120 Q30 60 25 0" stroke="#78350f" stroke-width="6" fill="none"/>
    <ellipse cx="10" cy="-10" rx="35" ry="12" fill="#15803d" transform="rotate(-30 10 -10)"/>
    <ellipse cx="40" cy="-10" rx="35" ry="12" fill="#16a34a" transform="rotate(30 40 -10)"/>
    <ellipse cx="25" cy="-25" rx="30" ry="10" fill="#15803d" transform="rotate(-70 25 -25)"/>
  </g>

  <!-- Terminal Platform / Roadway -->
  <rect x="0" y="360" width="800" height="140" fill="#334155"/>
  <rect x="0" y="360" width="800" height="8" fill="#f59e0b"/>

  <!-- Buses arriving at Vizag -->
  <g transform="translate(240, 340)">
    <rect x="0" y="0" width="220" height="90" rx="10" fill="#0e4429" stroke="#fef08a" stroke-width="2"/>
    <rect x="0" y="55" width="220" height="6" fill="#ffffff"/>
    <rect x="0" y="63" width="220" height="4" fill="#f59e0b"/>
    <!-- Windows -->
    <rect x="15" y="12" width="30" height="32" rx="3" fill="#0f172a"/>
    <rect x="52" y="12" width="30" height="32" rx="3" fill="#0f172a"/>
    <rect x="89" y="12" width="30" height="32" rx="3" fill="#0f172a"/>
    <rect x="126" y="12" width="30" height="32" rx="3" fill="#0f172a"/>
    <polygon points="165,12 210,12 215,44 165,44" fill="#0f172a"/>
    <circle cx="45" cy="90" r="14" fill="#0f172a"/>
    <circle cx="180" cy="90" r="14" fill="#0f172a"/>
    <text x="60" y="77" font-size="9" fill="#ffffff" font-family="sans-serif" font-weight="900">APSRTC GARUDA PLUS</text>
  </g>

  <!-- Overlay Banner -->
  <rect x="24" y="24" width="400" height="54" rx="8" fill="#072516" opacity="0.9" stroke="#15803d" stroke-width="1.5"/>
  <text x="40" y="45" font-size="14" fill="#ffffff" font-family="sans-serif" font-weight="800">DWARAKA RTC BUS STATION (VIZAG)</text>
  <text x="40" y="63" font-size="10" fill="#fde68a" font-family="sans-serif">Coastal City Mega Terminal • Sea Level Hub: 15m</text>
</svg>
